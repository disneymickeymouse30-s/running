<style>
/* レイアウト：下部タブ＋1カラム（最大760px）。ホームは大会ゼッケン型のカウントダウンが主役 */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#f6f8fb; --ink:#14202e; --muted:#5a6878; --line:#d9e0e8;
  --accent:#1d5fd0; --accent-ink:#ffffff; --accent-soft:#e3ecfb;
  --race:#e2621b; --race-ink:#ffffff; --race-soft:#fdebdf; --good:#1b7f52; --good-soft:#e1f3ea; --warn:#9a6a00; --warn-soft:#fbf1d6;
  --bad:#c23a3a; --bad-soft:#fbe4e4; --walk:#2f8f8a; --hard:#b0420f;
  --num:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --surface:#17202a; --surface-2:#1d2733; --ink:#e6edf5; --muted:#97a5b5; --line:#2b3746;
  --accent:#6f9dff; --accent-ink:#0b1320; --accent-soft:#1d2c48;
  --race:#ff8b4a; --race-ink:#2a1406; --race-soft:#3a2416; --good:#4cc38a; --good-soft:#15301f; --warn:#e2b54e; --warn-soft:#352a10;
  --bad:#ff7070; --bad-soft:#3a1b1b; --walk:#5cc7c0; --hard:#ff8a5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#17202a; --surface-2:#1d2733; --ink:#e6edf5; --muted:#97a5b5; --line:#2b3746;
  --accent:#6f9dff; --accent-ink:#0b1320; --accent-soft:#1d2c48;
  --race:#ff8b4a; --race-ink:#2a1406; --race-soft:#3a2416; --good:#4cc38a; --good-soft:#15301f; --warn:#e2b54e; --warn-soft:#352a10;
  --bad:#ff7070; --bad-soft:#3a1b1b; --walk:#5cc7c0; --hard:#ff8a5c; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--jp);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)}
body.in-sub .wrap{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h2{font-size:15px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grow{flex:1 1 auto;min-width:0}
.hidden{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ヘッダー */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 2px 2px}
.top .date{font-size:20px;font-weight:700}
.brand{font-family:var(--num);font-weight:700;letter-spacing:.14em;font-size:12px;color:var(--accent)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;background:var(--bg);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.bar h1{font-size:17px;flex:1;min-width:0}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:8px 6px;min-height:44px;cursor:pointer}

/* カード */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{background:transparent;border:0;padding:0}
.sec-title{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.sec-title h2{font-size:15px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0;cursor:pointer;font-size:14px}

/* ゼッケン型カウントダウン */
.bib{position:relative;border-radius:10px;background:var(--surface);border:1px solid var(--line);overflow:hidden;cursor:pointer;text-align:left;width:100%;padding:0}
.bib-top{background:var(--race);color:var(--race-ink);display:flex;justify-content:space-between;padding:7px 24px;font-family:var(--num);font-weight:600;letter-spacing:.12em;font-size:13px}
.bib-body{padding:12px 24px 14px;position:relative}
.bib-body::before,.bib-body::after,.bib-top::before,.bib-top::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.bib-top{position:relative}
.bib-top::before{left:6px;top:7px}.bib-top::after{right:6px;top:7px}
.bib-body::before{left:6px;bottom:8px}.bib-body::after{right:6px;bottom:8px}
.bib-name{font-weight:700;font-size:16px}
.bib-count{display:flex;align-items:baseline;gap:8px;margin:2px 0}
.bib-big{font-family:var(--num);font-weight:700;font-size:76px;line-height:.95;color:var(--ink);font-variant-numeric:tabular-nums}
.bib-big.word{font-size:40px;line-height:1.2;color:var(--race)}
.bib-unit{font-weight:700;font-size:16px}
.bib-meta{font-size:13px;color:var(--muted)}

/* ボタン */
.btn{white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.race{background:var(--race);border-color:var(--race);color:var(--race-ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost-danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.big{min-height:58px;font-size:17px;border-radius:14px}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>.btn{flex:1 1 140px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:620px){.kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--num);font-weight:700;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .val small{font-family:var(--jp);font-size:13px;font-weight:600;margin-left:3px;color:var(--muted)}
.kpi .val.none{font-family:var(--jp);font-size:16px;color:var(--muted);font-weight:600;padding-top:10px}
.kpi .delta{font-size:12px;color:var(--muted)}

/* 進捗バー */
.prog{display:flex;flex-direction:column;gap:6px}
.prog-track{height:10px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:6px}
.prog-fill.over{background:var(--good)}
.prog .between{font-size:13px}

/* チップ・バッジ */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.src{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.badge.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.badge.race{background:var(--race-soft);color:var(--race);border-color:transparent}
.badge.main{background:var(--race);color:var(--race-ink);border-color:transparent}

/* 記録カード */
.wlist{display:flex;flex-direction:column;gap:10px}
.witem{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.wdate{text-align:center;border-right:1px solid var(--line);padding-right:10px}
.wdate .d{font-family:var(--num);font-weight:700;font-size:22px;line-height:1}
.wdate .w{font-size:12px;color:var(--muted)}

/* インポート */

.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre}

/* トースト・モーダル */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}

.modal-bg{position:fixed;inset:0;z-index:40;background:rgba(10,16,24,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}

<script>
/* ===== Core: 純粋関数（日付・計算・検証・CSV・ヘルスケアXML解析・重複判定・提案） ===== */
var Core = (function () {
  'use strict';
  const pad2 = n => String(n).padStart(2, '0');
  const DOW = ['日', '月', '火', '水', '木', '金', '土'];

  /* ---------- 日付 ---------- */
  function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function hm(d) { return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
  function isYmd(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const [y, m, d] = s.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return y >= 1900 && y <= 2200 && dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
  }
  function isHm(s) { return typeof s === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(s); }
  function toDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
  function addDays(s, n) { const d = toDate(s); d.setDate(d.getDate() + n); return ymd(d); }
  function dayDiff(a, b) { // b - a（日）
    const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number);
    return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000);
  }
  function weekStart(s) { const w = (toDate(s).getDay() + 6) % 7; return addDays(s, -w); } // 月曜始まり
  function monthStart(s) { return s.slice(0, 8) + '01'; }
  function monthEnd(s) { const [y, m] = s.split('-').map(Number); return ymd(new Date(y, m, 0)); }
  function addMonths(s, n) { const [y, m] = s.split('-').map(Number); return ymd(new Date(y, m - 1 + n, 1)); }
  function dow(s) { return DOW[toDate(s).getDay()]; }
  function fmtDateJa(s) { const [y, m, d] = s.split('-').map(Number); return `${y}年${m}月${d}日（${dow(s)}）`; }
  function fmtMD(s) { const [, m, d] = s.split('-').map(Number); return `${m}/${d}`; }
  function normDate(s) { // 2026/9/1 → 2026-09-01
    const m = String(s || '').trim().match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
    if (!m) return null; const r = `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`; return isYmd(r) ? r : null;
  }
  function normTime(s) {
    const m = String(s || '').trim().match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
    if (!m) return null; const r = `${pad2(m[1])}:${m[2]}`; return isHm(r) ? r : null;
  }

  /* ---------- 数値・表示（丸めは ここに統一） ---------- */
  // 距離：小数2桁(km) / ペース：秒単位で四捨五入 / 速度：小数1桁 / 割合：整数に四捨五入
  function round(n, dp) { const f = 10 ** dp; return Math.round(n * f) / f; }
  function fmtKm(m) { return (m == null || !isFinite(m)) ? '—' : round(m / 1000, 2).toFixed(2); }
  function fmtDur(sec, withSec) {
    if (sec == null || !isFinite(sec)) return '—';
    sec = Math.round(sec);
    if (!withSec) {
      const tm = Math.round(sec / 60), H = Math.floor(tm / 60), M = tm % 60;
      return H ? `${H}時間${pad2(M)}分` : `${M}分`;
    }
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return (h ? `${h}時間${pad2(m)}分` : `${m}分`) + (s ? `${pad2(s)}秒` : '');
  }
  function fmtClock(sec) {
    if (sec == null || !isFinite(sec)) return '';
    sec = Math.round(sec); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return h ? `${h}:${pad2(m)}:${pad2(s)}` : `${m}:${pad2(s)}`;
  }
  function fmtPace(p) { if (p == null || !isFinite(p)) return '—'; const r = Math.round(p); return `${Math.floor(r / 60)}'${pad2(r % 60)}"`; }
  function fmtPaceClock(p) { if (p == null || !isFinite(p)) return ''; const r = Math.round(p); return `${Math.floor(r / 60)}:${pad2(r % 60)}`; }
  function paceSec(distM, durSec) { if (!(distM > 0) || !(durSec > 0)) return null; return durSec / (distM / 1000); }
  function speedKmh(distM, durSec) { if (!(distM > 0) || !(durSec > 0)) return null; return (distM / 1000) / (durSec / 3600); }
  function fmtSpeed(v) { return v == null ? '—' : round(v, 1).toFixed(1); }
  function pct(a, b) { return (b > 0) ? Math.round(a / b * 100) : null; }

  function parsePace(str) { // "5:30" "5'30"" → 秒/km、空→null、不正→NaN
    if (str == null) return null; str = String(str).trim(); if (!str) return null;
    const m = str.match(/^(\d{1,2})\s*[:'’′分]\s*(\d{1,2})\s*(?:["”″秒])?$/);
    if (!m) return NaN; const s = +m[2]; if (s > 59) return NaN; return +m[1] * 60 + s;
  }
  function parseClock(str) { // "h:mm:ss" または "mm:ss" → 秒
    if (str == null) return null; str = String(str).trim(); if (!str) return null;
    const p = str.split(':'); if (p.length < 2 || p.length > 3 || p.some(x => !/^\d+$/.test(x))) return NaN;
    const n = p.map(Number);
    if (p.length === 3) { if (n[1] > 59 || n[2] > 59) return NaN; return n[0] * 3600 + n[1] * 60 + n[2]; }
    if (n[1] > 59) return NaN; return n[0] * 60 + n[1];
  }
  function parseTarget(str) { // 大会目標 "3:40" = 3時間40分、"3:40:30" も可
    if (str == null) return null; str = String(str).trim(); if (!str) return null;
    const p = str.split(':'); if (p.length < 2 || p.length > 3 || p.some(x => !/^\d+$/.test(x))) return NaN;
    const n = p.map(Number); if (n[1] > 59 || (n[2] || 0) > 59) return NaN;
    return n[0] * 3600 + n[1] * 60 + (n[2] || 0);
  }

  /* ---------- 練習種別 ---------- */
  const DEFAULT_TYPES = [
    { name: 'ウォーキング', cat: 'walk' }, { name: 'ジョギング', cat: 'run' }, { name: 'ペース走', cat: 'hard' },
    { name: 'ロング走', cat: 'run' }, { name: 'インターバル練習', cat: 'hard' }, { name: 'ビルドアップ走', cat: 'hard' },
    { name: 'LSD', cat: 'run' }, { name: '大会・レース', cat: 'race' }, { name: 'その他', cat: 'other' }
  ];
  const CAT_LABEL = { run: 'ランニング', walk: 'ウォーキング', hard: '強度の高い練習', race: '大会・レース', other: 'その他' };
  function catOf(type, types) {
    const t = (types || []).find(x => x.name === type) || DEFAULT_TYPES.find(x => x.name === type);
    return t ? t.cat : 'other';
  }

  /* ---------- 集計 ---------- */
  function countedDist(w, ctx) {
    if (!(w.distanceM > 0)) return 0;
    if (ctx && ctx.includeWalk === false && catOf(w.type, ctx.types) === 'walk') return 0;
    return w.distanceM;
  }
  function aggregate(ws, from, to, ctx) {
    const r = { distM: 0, count: 0, durSec: 0, pDist: 0, pDur: 0, distCount: 0 };
    for (const w of ws) {
      if (w.date < from || w.date > to) continue;
      r.count++;
      if (w.durationSec > 0) r.durSec += w.durationSec;
      const d = countedDist(w, ctx);
      if (d > 0) {
        r.distM += d; r.distCount++;
        if (w.durationSec > 0) { r.pDist += d; r.pDur += w.durationSec; }
      }
    }
    r.avgPace = paceSec(r.pDist, r.pDur);
    r.avgDist = r.distCount ? r.distM / r.distCount : null;
    return r;
  }

  /* ---------- 検証 ---------- */
  const SOURCES = ['manual', 'apple_xml', 'csv', 'json'];
  const SOURCE_LABEL = { manual: '手入力', apple_xml: 'AppleヘルスケアXML', csv: 'CSVインポート', json: 'JSONインポート' };
  function validateWorkout(w) {
    const e = [];
    if (!w || typeof w !== 'object') return ['記録の形式が正しくありません'];
    if (!isYmd(w.date)) e.push('実施日が正しくありません');
    if (!w.type || typeof w.type !== 'string' || !w.type.trim()) e.push('練習種別を選んでください');
    const d = w.distanceM, t = w.durationSec;
    if (d != null && !(typeof d === 'number' && isFinite(d) && d >= 0 && d <= 500000)) e.push('距離は0〜500kmの数値で入力してください');
    if (t != null && !(typeof t === 'number' && isFinite(t) && t >= 0 && t <= 172800)) e.push('運動時間は48時間以内で入力してください');
    if (!(d > 0) && !(t > 0)) e.push('距離または運動時間のどちらかを入力してください');
    if (w.startTime != null && w.startTime !== '' && !isHm(w.startTime)) e.push('開始時刻が正しくありません');
    for (const [k, lab] of [['avgHr', '平均心拍数'], ['maxHr', '最大心拍数']]) {
      const v = w[k];
      if (v != null && !(Number.isInteger(v) && v >= 30 && v <= 250)) e.push(lab + 'は30〜250の整数で入力してください');

const DB = (() => {
  const NAME = 'running-training-log', VER = 1, STORES = ['workouts', 'races', 'plans', 'shoes', 'kv'];
  let db = null;
  function open() {
    return new Promise((res, rej) => {
      if (!('indexedDB' in window) || !window.indexedDB) return rej(new Error('このブラウザはIndexedDB（ブラウザ内データベース）に対応していません'));
      let r;
      try { r = indexedDB.open(NAME, VER); } catch (e) { return rej(e); }
      r.onupgradeneeded = () => {
        const d = r.result;
        for (const s of STORES) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: s === 'kv' ? 'key' : 'id' });
      };
      r.onsuccess = () => { db = r.result; db.onversionchange = () => { db.close(); }; res(db); };
      r.onerror = () => rej(r.error || new Error('データベースを開けません'));
      r.onblocked = () => rej(new Error('別のタブでこのアプリが開かれているため、データベースを開けません。ほかのタブを閉じてください'));
    });
  }
  // 1つのトランザクションで実行。途中で失敗した場合は全体が取り消される（既存データは壊れない）
  function tx(stores, mode, fn) {
    return new Promise((res, rej) => {
      if (!db) return rej(new Error('データベースが開かれていません'));
      let t;
      try { t = db.transaction(stores, mode); } catch (e) { return rej(e); }
      const st = {}; [].concat(stores).forEach(s => { st[s] = t.objectStore(s); });
      let result;
      t.oncomplete = () => res(result);
      t.onerror = () => rej(t.error || new Error('保存に失敗しました'));
      t.onabort = () => rej(t.error || new Error('処理が中止されたため、変更は保存されていません'));
      try { result = fn(st, t); } catch (e) { try { t.abort(); } catch (_) { } rej(e); }
    });
  }
  async function getAll(store) { const r = await tx(store, 'readonly', st => st[store].getAll()); return r.result || []; }
  const put = (store, obj) => tx(store, 'readwrite', st => { st[store].put(obj); });
  const del = (store, id) => tx(store, 'readwrite', st => { st[store].delete(id); });
  return { open, tx, getAll, put, del, STORES };
})();

'use strict';
const C = Core;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);

const S = { workouts: [], races: [], plans: [], shoes: [], kv: {} };

async function setKV(k, v) { await DB.put('kv', { key: k, value: v }); S.kv[k] = v; }
const types = () => kv('types', C.DEFAULT_TYPES);
const settings = () => kv('settings', {});
const ctx = () => ({ includeWalk: settings().includeWalk !== false, types: types() });
const byTimeDesc = (a, b) => (b.date + (b.startTime || '99:99')).localeCompare(a.date + (a.startTime || '99:99')) || (b.createdAt || '').localeCompare(a.createdAt || '');

/* ---------- 共通UI ---------- */
let toastTimer;
function toast(msg, err) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); t.setAttribute('aria-live', 'polite'); document.body.appendChild(t); }
  t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, err ? 5000 : 2600);
}
function modal(inner, onClick) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${inner}</div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click', e => onClick(e, bg));
  return bg;
}
function ask({ title, body = '', ok = 'OK', cancel = 'キャンセル', danger = false, html = false }) {
  return new Promise(res => {
    const bg = modal(`<h3>${esc(title)}</h3>${html ? body : `<p>${esc(body)}</p>`}<div class="btns">${cancel ? `<button class="btn" data-r="0">${esc(cancel)}</button>` : ''}<button class="btn ${danger ? 'danger' : 'primary'}" data-r="1">${esc(ok)}</button></div>`,
      (e, bg) => { const b = e.target.closest('[data-r]'); if (b) { bg.remove(); res(b.dataset.r === '1'); } else if (e.target === bg && cancel) { bg.remove(); res(false); } });
    const f = bg.querySelector('[data-r="1"]'); f && f.focus();
  });
}
function askText(title, label, def = '', okLabel = '登録') {
  return new Promise(res => {
    const bg = modal(`<h3>${esc(title)}</h3><div class="field"><label for="ask-in">${esc(label)}</label><input type="text" id="ask-in" maxlength="40" value="${esc(def)}"></div><div class="btns"><button class="btn" data-r="0">キャンセル</button><button class="btn primary" data-r="1">${esc(okLabel)}</button></div>`,
      (e, bg) => { const b = e.target.closest('[data-r]'); if (!b) return; const v = $('#ask-in', bg).value.trim(); bg.remove(); res(b.dataset.r === '1' ? v : null); });
    setTimeout(() => $('#ask-in', bg).focus(), 30);
  });
}
function errMsg(e) {
  const m = (e && (e.message || e.name)) || String(e);
  if (e && e.name === 'QuotaExceededError') return 'ストレージの空き容量が不足しています。不要なデータを削除するか、端末の空き容量を確認してください。';
  if (/InvalidStateError|mutation/i.test(m)) return 'このブラウザのモード（プライベートブラウズ等）ではデータを保存できない可能性があります。通常モードで開いてください。（' + m + '）';
  return m;

}
function progHtml(label, cur, goal, fmt, unit) {

function mainRace() {

function fmtTarget(sec) { if (!(sec > 0)) return ''; const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return `${h}時間${C.pad2(m)}分${s ? C.pad2(s) + '秒' : ''}`; }

/* ---------- グラフ（SVG） ---------- */
function niceMax(m) { if (!(m > 0)) return 1; const p = 10 ** Math.floor(Math.log10(m)), n = m / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function barChart(data, { h = 180, fmt = v => v.toFixed(1), every = 1, goal = null, unit = '' } = {}) {
  const W = 340, L = 32, R = 6, T = 18, B = 34, ih = h - T - B, iw = W - L - R;
  const max = Math.max(goal || 0, ...data.map(d => d.v || 0)), top = niceMax(max);
  const bw = iw / data.length, y = v => T + (1 - v / top) * ih;
  const tf = v => top < 10 ? v.toFixed(1) : String(Math.round(v));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(unit)}">`;
  for (const v of [0, top / 2, top]) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 4}" y="${y(v) + 4}" text-anchor="end">${tf(v)}</text>`;
  data.forEach((d, i) => {
    const x = L + i * bw, v = d.v || 0;
    if (v > 0) s += `<rect class="bar${d.hl ? ' hl' : ''}" x="${(x + bw * .17).toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw * .66).toFixed(1)}" height="${(T + ih - y(v)).toFixed(1)}" rx="2"><title>${esc(d.l)} ${fmt(v)}${unit}</title></rect>`;
    if (v > 0 && data.length <= 14) s += `<text class="v" x="${(x + bw / 2).toFixed(1)}" y="${(y(v) - 4).toFixed(1)}" text-anchor="middle">${fmt(v)}</text>`;
    if (i % every === 0 || i === data.length - 1) {
      s += `<text x="${(x + bw / 2).toFixed(1)}" y="${h - B + 15}" text-anchor="middle">${esc(d.l)}</text>`;
      if (d.l2) s += `<text x="${(x + bw / 2).toFixed(1)}" y="${h - B + 28}" text-anchor="middle">${esc(d.l2)}</text>`;
    }
  });
  if (goal > 0) s += `<line class="goal" x1="${L}" x2="${W - R}" y1="${y(goal)}" y2="${y(goal)}"/><text x="${W - R}" y="${y(goal) - 4}" text-anchor="end" style="fill:var(--race)">目標</text>`;
  return s + '</svg>';
}
function lineChart(pts, { h = 170, fmt = v => v, invert = false, every = 1 } = {}) {
  const vals = pts.map(p => p.v).filter(v => v != null);
  if (!vals.length) return '<div class="empty">この期間はデータがありません</div>';
  const W = 340, L = 44, R = 10, T = 16, B = 26, ih = h - T - B, iw = W - L - R;
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = Math.max((hi - lo) * .15, 5); lo -= pad; hi += pad;
  const x = i => L + (pts.length === 1 ? iw / 2 : i * iw / (pts.length - 1));
  const y = v => invert ? T + (v - lo) / (hi - lo) * ih : T + (1 - (v - lo) / (hi - lo)) * ih;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">`;
  for (const v of [lo + pad, (lo + hi) / 2, hi - pad]) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 4}" y="${y(v) + 4}" text-anchor="end">${esc(fmt(v))}</text>`;
  let seg = [];
  const flush = () => { if (seg.length > 1) s += `<polyline class="line" points="${seg.join(' ')}"/>`; seg = []; };
  pts.forEach((p, i) => { if (p.v == null) flush(); else seg.push(`${x(i).toFixed(1)},${y(p.v).toFixed(1)}`); });
  flush();
  let lastI = -1; pts.forEach((p, i) => { if (p.v != null) lastI = i; });
  pts.forEach((p, i) => {
    if (p.v != null) s += `<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${i === lastI ? 4.5 : 2.8}"><title>${esc(p.l)} ${esc(fmt(p.v))}</title></circle>`;
    if (i % every === 0 || i === pts.length - 1) s += `<text x="${x(i).toFixed(1)}" y="${h - 8}" text-anchor="middle">${esc(p.l)}</text>`;
  });
  return s + '</svg>';
}
function distSeries(from, days, c) {
  const out = [];

const stack = [];

function replaceTop(v, p) { stack.pop(); stack.push({ v, p: p || {} }); render(true); }
const TAB = {}, SUB = {}, AFTER = {}, ACT = {};

  try { main.innerHTML = top ? SUB[top.v](top.p) : TAB[tab](); }
  catch (e) { console.error(e); main.innerHTML = `${top ? bar('エラー') : ''}<div class="alert err">画面の表示中にエラーが発生しました：${esc(e.message)}<br>ページを再読み込みしてください。解決しない場合は設定からバックアップを取ってください。</div>`; }
  $$('.nav button').forEach(b => b.setAttribute('aria-current', !top && b.dataset.tab === tab ? 'page' : 'false'));

/* ---------- 練習記録（履歴） ---------- */
const hf = { sort: 'desc', type: '', from: '', to: '', dmin: '', dmax: '', q: '', source: '', view: 'card', limit: 100 };
function filtered() {
  const q = hf.q.trim().toLowerCase();
  const dmin = hf.dmin !== '' ? parseFloat(hf.dmin) * 1000 : null, dmax = hf.dmax !== '' ? parseFloat(hf.dmax) * 1000 : null;
  const shoes = Object.fromEntries(S.shoes.map(s => [s.id, s.name]));
  let ws = S.workouts.filter(w => {
    if (hf.type && w.type !== hf.type) return false;
    if (hf.source && w.source !== hf.source) return false;
    if (hf.from && w.date < hf.from) return false;
    if (hf.to && w.date > hf.to) return false;
    if (dmin != null && !(w.distanceM >= dmin)) return false;
    if (dmax != null && !(w.distanceM > 0 && w.distanceM <= dmax)) return false;
    if (q) { const hay = [w.type, w.memo, w.weather, w.painNote, shoes[w.shoeId], C.SOURCE_LABEL[w.source], w.date].join(' ').toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  });
  ws = sortW(ws); if (hf.sort === 'asc') ws.reverse();
  return ws;
}

  const ws = filtered(), shown = ws.slice(0, hf.limit);
  if (!S.workouts.length) return '<div class="empty">まだ練習記録がありません。<br>「＋ 記録する」から最初の練習を登録できます。</div>';

  let body;
  if (hf.view === 'table') {
    body = `<div class="tablewrap"><table><thead><tr><th>実施日</th><th>曜日</th><th>練習種別</th><th>距離(km)</th><th>時間</th><th>平均ペース</th><th>平均心拍</th><th>疲労度</th><th>取得元</th></tr></thead><tbody>
    ${shown.map(w => { const p = C.paceSec(w.distanceM, w.durationSec); return `<tr data-act="detail" data-id="${esc(w.id)}"><td>${w.date}</td><td>${C.dow(w.date)}</td><td>${esc(w.type)}</td><td class="n">${w.distanceM > 0 ? C.fmtKm(w.distanceM) : '—'}</td><td>${w.durationSec > 0 ? C.fmtDur(w.durationSec, true) : '—'}</td><td class="n">${p ? C.fmtPace(p) : '—'}</td><td class="n">${w.avgHr ?? '—'}</td><td class="n">${w.fatigue ?? '—'}</td><td>${C.SOURCE_LABEL[w.source] || ''}</td></tr>`; }).join('')}</tbody></table></div>`;

SUB.detail = ({ id }) => {
  const w = S.workouts.find(x => x.id === id);
  if (!w) return bar('記録の詳細') + '<div class="empty" style="margin-top:16px">この記録は見つかりません（削除された可能性があります）</div>';
  const p = C.paceSec(w.distanceM, w.durationSec), sp = C.speedKmh(w.distanceM, w.durationSec);
  const race = mainRace(), tp = racePace(race);
  const shoe = w.shoeId ? (S.shoes.find(s => s.id === w.shoeId) || { name: '（削除済みのシューズ）' }) : null;
  const rows = [['実施日', C.fmtDateJa(w.date)], ['開始時刻', w.startTime || '—'], ['練習種別', esc(w.type)],
    ['距離', w.distanceM > 0 ? C.fmtKm(w.distanceM) + ' km' : '記録なし'], ['運動時間', w.durationSec > 0 ? C.fmtDur(w.durationSec, true) : '記録なし'],
    ['平均ペース（計算値）', p ? C.fmtPace(p) + ' /km' : '距離と時間がそろっていないため未計算'], ['平均速度', sp ? C.fmtSpeed(sp) + ' km/h' : '未計算']];
  if (w.manualPaceSec) {

  }
  const usePace = p || w.manualPaceSec;
  if (usePace && tp) { const d = Math.round(usePace - tp); rows.push(['目標ペースとの差', `${d === 0 ? '同じ' : `${Math.abs(d)}秒/km ${d > 0 ? '遅い' : '速い'}`}<div class="tiny muted">${esc(race.name)}の目標タイムから計算した理論上の平均ペース ${C.fmtPace(tp)}/km との比較</div>`]); }
  rows.push(['平均心拍数', w.avgHr ? w.avgHr + ' bpm' : '記録なし'], ['最大心拍数', w.maxHr ? w.maxHr + ' bpm' : '記録なし'],

};

AFTER.form = () => {
  const f = $('#wform');
  f.addEventListener('input', e => { formDirty = true; if (['f-dist', 'f-h', 'f-m', 'f-s', 'f-pace'].includes(e.target.id)) updateCalc(); });
  f.addEventListener('submit', e => { e.preventDefault(); showConfirm(); });
  updateCalc();
};
function readDur() {
  const raw = ['f-h', 'f-m', 'f-s'].map(id => $('#' + id).value.trim());
  if (raw.every(v => v === '')) return { sec: null };
  if (raw.some(v => v !== '' && !/^\d+$/.test(v))) return { err: '運動時間は0以上の整数で入力してください' };
  const [h, m, s] = raw.map(v => v === '' ? 0 : +v);
  if (m > 59 || s > 59) return { err: '運動時間の分・秒は0〜59で入力してください' };
  const sec = h * 3600 + m * 60 + s; return { sec: sec > 0 ? sec : null };
}
function readDist() {
  const v = $('#f-dist').value.trim(); if (!v) return { m: null };
  if (!/^\d+(\.\d+)?$/.test(v)) return { err: '距離は数値（例：5.2）で入力してください' };
  const m = Math.round(parseFloat(v) * 1000); return { m: m > 0 ? m : null };
}
function updateCalc() {
  const el = $('#f-calc'); if (!el) return;
  const d = readDist(), t = readDur();
  if (d.err || t.err) { el.innerHTML = `<span style="color:var(--bad)">${esc(d.err || t.err)}</span>`; return; }
  const p = C.paceSec(d.m, t.sec), sp = C.speedKmh(d.m, t.sec);
  if (!p) { el.innerHTML = '<span class="muted">距離と運動時間を入力すると、平均ペースと平均速度を自動計算します。</span>'; return; }
  let s = `平均ペース <b>${C.fmtPace(p)}</b>/km　平均速度 <b>${C.fmtSpeed(sp)}</b>km/h`;
  const mp = C.parsePace($('#f-pace').value);
  if (mp > 0 && Math.abs(mp - p) > 5) s += `<div class="small" style="color:var(--warn)">手入力のペース（${C.fmtPace(mp)}）と計算値が異なります</div>`;
  const tp = racePace(mainRace());
  if (tp) { const df = Math.round(p - tp); s += `<div class="tiny muted">大会の目標ペース（理論値 ${C.fmtPace(tp)}/km）より ${df === 0 ? '差なし' : Math.abs(df) + '秒/km ' + (df > 0 ? '遅い' : '速い')}</div>`; }
  el.innerHTML = s;
}
function readForm() {
  const errs = [], p = stack[stack.length - 1].p, old = p.id ? S.workouts.find(x => x.id === p.id) : null;
  const d = readDist(), t = readDur(); if (d.err) errs.push(d.err); if (t.err) errs.push(t.err);
  const int = (id, lab) => { const v = $('#' + id).value.trim(); if (!v) return null; if (!/^\d+$/.test(v)) { errs.push(lab + 'は整数で入力してください'); return null; } return +v; };
  const mp = C.parsePace($('#f-pace').value); if (Number.isNaN(mp)) errs.push('平均ペースは「5:30」の形式で入力してください');
  const fat = $('#f-fat').value, pain = $('#f-pain').value;
  const w = Object.assign({}, old || { id: uid(), source: 'manual', createdAt: nowIso() }, {
    date: $('#f-date').value, startTime: $('#f-start').value || null, type: $('#f-type').value,
    distanceM: d.m ?? null, durationSec: t.sec ?? null, manualPaceSec: Number.isNaN(mp) ? null : mp,
    avgHr: int('f-avghr', '平均心拍数'), maxHr: int('f-maxhr', '最大心拍数'),
    fatigue: fat === '' ? null : +fat, pain: pain === '' ? null : pain === '1', painNote: pain === '1' ? $('#f-painnote').value.trim() : '',
    weather: $('#f-weather').value, shoeId: $('#f-shoe').value || null, memo: $('#f-memo').value.trim(), updatedAt: nowIso()
  });
  if (!errs.length) errs.push(...C.validateWorkout(w));
  return { w, errs };
}
function showErrs(errs) {
  $('#f-err').innerHTML = errs.length ? `<div class="alert err"><b>入力内容を確認してください</b><ul>${errs.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>` : '';
  if (errs.length) $('#f-err').scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function showConfirm() {
  const { w, errs } = readForm();
  showErrs(errs); if (errs.length) return;

}

    const y = from.slice(0, 4), md = [], mt = [];
    for (let i = 1; i <= 12; i++) { const ms = `${y}-${C.pad2(i)}-01`, ag = C.aggregate(S.workouts, ms, C.monthEnd(ms), c); md.push({ l: i + '月', v: ag.distM / 1000, hl: ms === C.monthStart(t) }); mt.push({ l: i + '月', v: ag.durSec / 3600 }); }
    body += `<section class="card"><div class="sec-title"><h2>月別走行距離</h2><span class="tiny muted">km</span></div>${barChart(md.map(x => Object.assign({}, x, { l: x.l.replace('月', '') })), { fmt: v => v >= 100 ? v.toFixed(0) : v.toFixed(1), unit: 'km' })}</section>`;
    body += `<section class="card"><div class="sec-title"><h2>月別運動時間</h2><span class="tiny muted">時間</span></div>${barChart(mt.map(x => Object.assign({}, x, { l: x.l.replace('月', '') })), { fmt: v => v.toFixed(1), unit: '時間' })}</section>`;
  }
  // 推移
  const N = stv.trendN, endW = C.weekStart(stv.mode === 'week' ? from : (to < t ? to : t)), wd = [], wp = [];
  for (let i = N - 1; i >= 0; i--) { const s = C.addDays(endW, -7 * i), ag = C.aggregate(S.workouts, s, C.addDays(s, 6), c); wd.push({ l: C.fmtMD(s), v: ag.distM / 1000, hl: s === endW }); wp.push({ l: C.fmtMD(s), v: ag.avgPace }); }
  body += `<section class="card"><div class="sec-title"><h2>週間走行距離の推移</h2><select id="st-n" aria-label="期間" style="width:auto;min-height:36px;padding:4px 8px">${[8, 12, 26, 52].map(n => `<option value="${n}" ${n === N ? 'selected' : ''}>${n}週</option>`).join('')}</select></div>${barChart(wd, { every: Math.ceil(N / 6), goal: g.weekDistKm || null, unit: 'km', fmt: v => v.toFixed(0) })}<div class="tiny muted">${C.fmtMD(C.addDays(endW, -7 * (N - 1)))}の週〜${C.fmtMD(endW)}の週（月曜始まり）</div></section>`;
  body += `<section class="card"><div class="sec-title"><h2>平均ペースの推移（週ごと）</h2><span class="tiny muted">上ほど速い</span></div>${lineChart(wp, { invert: true, fmt: v => C.fmtPace(v), every: Math.ceil(N / 6) })}<div class="tiny muted">記録がない週は線をつなげず、空白のままにしています。</div></section>`;
  return `<header class="top"><div><div class="brand">STATS</div><div class="date">統計</div></div><button class="link" data-act="open" data-v="goals">目標設定</button></header>
  <div class="stack" style="margin-top:12px">
   <div class="seg" role="group" aria-label="集計期間">${[['week', '週間'], ['month', '月間'], ['year', '年間']].map(([k, l]) => `<button data-act="stMode" data-v="${k}" aria-pressed="${stv.mode === k}">${l}</button>`).join('')}</div>
   <div class="between"><button class="btn sm" data-act="stNav" data-n="-1" aria-label="前へ">‹</button><b>${label}</b><button class="btn sm" data-act="stNav" data-n="1" aria-label="次へ">›</button></div>
   <div class="kpis">${kpis.join('')}</div>
   <div class="small muted">走行距離は${c.includeWalk ? 'ウォーキングを含みます' : 'ウォーキングを除いています'}（設定で変更できます）。距離のない記録は回数・時間のみに反映します。</div>
   ${body}
  </div>`;
};

async function onImportFile(file) {
  IMP = { fileName: file.name, size: file.size, status: 'reading', progress: 0, warnings: [], limit: 200, cancel: false };
  drawImp();
  const prog = (d, t) => { IMP.progress = t ? Math.min(1, d / t) : 0; const pg = $('#imp-pg'), pt = $('#imp-pt'); if (pg) pg.style.width = Math.round(IMP.progress * 100) + '%'; if (pt) pt.firstChild.nodeValue = Math.round(IMP.progress * 100) + '%　'; };
  try {
    const head = await readU8(file, 0, Math.min(file.size, 8)), name = file.name.toLowerCase();
    const isZip = head[0] === 0x50 && head[1] === 0x4b;
    let kind = isZip ? 'zip' : name.endsWith('.csv') ? 'csv' : name.endsWith('.json') ? 'json' : (name.endsWith('.xml') || head[0] === 0x3c || (head[0] === 0xEF && head[3] === 0x3c)) ? 'xml' : null;
    if (!kind) throw new Error('対応していないファイル形式です。ZIP・XML・CSV・JSONのいずれかを選んでください');
    if (file.size === 0) throw new Error('ファイルが空です');
    if ((kind === 'zip' || kind === 'xml') && file.size > LIMIT.health) throw new Error(`ファイルが大きすぎます（${fmtBytes(file.size)}）。上限は${fmtBytes(LIMIT.health)}です`);
    if ((kind === 'csv' || kind === 'json') && file.size > LIMIT.text) throw new Error(`ファイルが大きすぎます（${fmtBytes(file.size)}）。CSV・JSONの上限は${fmtBytes(LIMIT.text)}です`);
    let items;
    if (kind === 'csv' || kind === 'json') {
      const text = await file.text(); prog(1, 1);
      const r = kind === 'csv' ? C.parseAppCSV(text) : C.parseAppJSON(text);
      if (r.error) throw new Error(r.error);
      items = r.items; IMP.format = kind;
    } else { items = await readHealth(file, kind, prog); IMP.format = 'apple_xml'; }
    if (!items.length) throw new Error('ワークアウトの記録が見つかりませんでした。ヘルスケアにワークアウトが保存されているか確認してください');
    C.classifyDuplicates(items, S.workouts);
    const tn = types().map(t => t.name), walk = (types().find(t => t.cat === 'walk') || {}).name;
    const other = tn.includes('その他') ? 'その他' : tn[tn.length - 1];
    const groups = {};
    for (const it of items) {
      const g = groups[it.group] || (groups[it.group] = { count: 0, label: IMP.format === 'apple_xml' ? C.actName(it.group) : it.group, sel: true, map: other });
      if (!it.error) g.count++;
    }
    for (const [k, g] of Object.entries(groups)) {
      if (IMP.format === 'apple_xml') {
        const a = k.replace('HKWorkoutActivityType', '');
        g.sel = a === 'Running' || a === 'Walking';
        g.map = a === 'Running' ? (tn.includes('ジョギング') ? 'ジョギング' : other) : (a === 'Walking' || a === 'Hiking') && walk ? walk : other;
      } else g.map = tn.includes(k) ? k : (k !== '—' ? '__add__' : other);
    }
    items.forEach(i => { i.checked = !i.error && !i.dup; });
    Object.assign(IMP, { status: 'preview', items, groups });
  } catch (e) {
    console.warn(e);
    Object.assign(IMP, { status: 'error', error: e && e.message ? e.message : String(e) });
  }
  drawImp();
}
ACT.impRun = async () => {
  const sel = selItems(); if (!sel.length) { toast('取り込む記録が選ばれていません', true); return; }
  const nPos = sel.filter(i => i.dup === 'possible').length;
  const ok = await ask({ title: 'インポートの確認', body: `${sel.length}件を練習記録に追加します。${nPos ? `\nうち${nPos}件は「重複の可能性あり」の記録です。` : ''}\n既存の記録は変更・上書きされません。`, ok: 'インポートする' });
  if (!ok) return;
  const now = nowIso(), recs = [], failed = [], newTypes = [];
  for (const [k, g] of Object.entries(IMP.groups)) if (g.sel && g.map === '__add__' && !types().some(t => t.name === k)) newTypes.push({ name: k, cat: 'run' });
  for (const it of sel) {
    const g = IMP.groups[it.group], type = g.map === '__add__' ? it.group : g.map;
    const w = {
      id: uid(), date: it.date, startTime: it.startTime || null, type, distanceM: it.distanceM || null, durationSec: it.durationSec || null,
      avgHr: it.avgHr ?? null, maxHr: it.maxHr ?? null, fatigue: it.fatigue ?? null, pain: null, painNote: '', weather: '', shoeId: null, memo: it.memo || '', manualPaceSec: null,

    };
    const e = C.validateWorkout(w); if (e.length) failed.push({ it, msg: e.join('／') }); else recs.push(w);
  }
  const c = ctx(), totalD = ws => ws.reduce((a, w) => a + C.countedDist(w, c), 0);
  const before = { n: S.workouts.length, d: totalD(S.workouts) };
  const tl = newTypes.length ? [...types(), ...newTypes] : null;

    await DB.tx(['workouts', 'kv'], 'readwrite', st => { recs.forEach(r => st.workouts.add(r)); if (tl) st.kv.put({ key: 'types', value: tl }); });

  requestPersist();

async function saveFile(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  const standalone = window.matchMedia && matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone && navigator.canShare) {
    try { const file = new File([blob], name, { type: mime }); if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; } }
    catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  return true;
}

  if (RST.error) return `<div class="alert err"><b>このファイルは復元できません</b><br>${esc(RST.error)}${RST.errors ? `<ul>${RST.errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul>${RST.more ? `<div>ほか${RST.more}件</div>` : ''}` : ''}<br><span class="small">既存のデータは変更されていません。</span></div>`;
  if (RST.done) return `<div class="alert ok">復元が完了しました。${RST.done}</div>`;
  const c = RST.v.counts, d = RST.obj.data;
  const nNew = d.workouts.filter(w => !S.workouts.some(x => x.id === w.id)).length;
  return `<section class="card stack"><h2>復元する内容</h2>
   <dl class="dl"><dt>ファイル</dt><dd>${esc(RST.fileName)}</dd><dt>作成日時</dt><dd>${RST.obj.exportedAt ? new Date(RST.obj.exportedAt).toLocaleString('ja-JP') : '不明'}</dd></dl>
   <div class="tablewrap"><table><thead><tr><th>データ</th><th>バックアップ</th><th>現在</th></tr></thead><tbody>
    <tr><td>練習記録</td><td class="n">${c.workouts}</td><td class="n">${S.workouts.length}</td></tr><tr><td>大会</td><td class="n">${c.races}</td><td class="n">${S.races.length}</td></tr>
    <tr><td>練習予定</td><td class="n">${c.plans}</td><td class="n">${S.plans.length}</td></tr><tr><td>シューズ</td><td class="n">${c.shoes}</td><td class="n">${S.shoes.length}</td></tr></tbody></table></div>
   <div class="field"><span class="lab2">復元方法</span>
    <label class="check"><input type="radio" name="rst-mode" value="replace" ${RST.mode === 'replace' ? 'checked' : ''}><span><b>置き換え</b>：現在のデータをすべて消して、バックアップの内容にします</span></label>
    <label class="check"><input type="radio" name="rst-mode" value="add" ${RST.mode === 'add' ? 'checked' : ''}><span><b>追加</b>：現在のデータを残し、まだ無いものだけ追加します（練習記録 ${nNew}件が追加対象。目標・設定は現在のまま）</span></label></div>
   <button class="btn ${RST.mode === 'replace' ? 'danger' : 'primary'} block" data-act="rstRun">${RST.mode === 'replace' ? '置き換えて復元する' : '追加して復元する'}</button></section>`;
}
AFTER.restore = () => {
  $('#rst-file').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    RST = { fileName: f.name, mode: 'add' };
    try {
      if (f.size > LIMIT.backup) throw new Error(`ファイルが大きすぎます（上限${fmtBytes(LIMIT.backup)}）`);
      let obj; try { obj = JSON.parse(await f.text()); } catch (er) { throw new Error('JSONとして読み取れません'); }
      if (obj && obj.format === C.JSON_FORMAT) throw new Error('これは練習記録の取り込み用JSONです。「Apple Watchデータのインポート」から読み込んでください');
      const v = C.validateBackup(obj);
      if (!v.ok) { RST.error = 'バックアップの内容に問題があります'; RST.errors = v.errors; RST.more = v.more; }
      else Object.assign(RST, { obj, v });
    } catch (er) { RST.error = er.message; }
    drawRst();
  });
  bindRst();
};
function drawRst() { const a = $('#rst-area'); if (a) { a.innerHTML = rstArea(); bindRst(); } }
function bindRst() { $$('[name="rst-mode"]').forEach(r => r.addEventListener('change', () => { RST.mode = r.value; drawRst(); })); }
ACT.rstRun = async () => {
  const d = RST.obj.data, rep = RST.mode === 'replace';
  const ok = await ask({ title: rep ? '現在のデータを置き換えますか？' : '復元しますか？', body: rep ? `現在の練習記録${S.workouts.length}件などをすべて削除し、バックアップの内容（練習記録${d.workouts.length}件）に置き換えます。\nこの操作は取り消せません。必要なら先に現在のデータをバックアップしてください。` : 'まだ無いデータだけを追加します。既存のデータは変更されません。', ok: rep ? '置き換える' : '復元する', danger: rep });
  if (!ok) return;
  let added = 0;
  try {
    await DB.tx(DB.STORES, 'readwrite', st => {
      if (rep) {
        DB.STORES.forEach(s => st[s].clear());
        ['workouts', 'races', 'plans', 'shoes'].forEach(s => d[s].forEach(x => st[s].put(x)));
        Object.entries(d.kv).forEach(([key, value]) => st.kv.put({ key, value }));
        st.kv.put({ key: 'seeded', value: true });
        added = d.workouts.length;
      } else {
        const has = { workouts: new Set(S.workouts.map(x => x.id)), races: new Set(S.races.map(x => x.id)), plans: new Set(S.plans.map(x => x.id)), shoes: new Set(S.shoes.map(x => x.id)) };
        ['workouts', 'races', 'plans', 'shoes'].forEach(s => d[s].forEach(x => { if (!has[s].has(x.id)) { st[s].add(x); if (s === 'workouts') added++; } }));
        const tl = [...types()]; (Array.isArray(d.kv.types) ? d.kv.types : []).forEach(t => { if (t && t.name && !tl.some(x => x.name === t.name)) tl.push(t); });
        const fv = [...kv('favorites', [])]; (Array.isArray(d.kv.favorites) ? d.kv.favorites : []).forEach(f => { if (f && f.id && !fv.some(x => x.id === f.id)) fv.push(f); });
        st.kv.put({ key: 'types', value: tl }); st.kv.put({ key: 'favorites', value: fv });
        if (!S.kv.goals && d.kv.goals) st.kv.put({ key: 'goals', value: d.kv.goals });
      }
    });
  } catch (e) { RST.error = '復元に失敗しました。原因：' + errMsg(e); RST.errors = null; drawRst(); return; }
  await loadAll();
  RST = { done: rep ? `バックアップの内容に置き換えました（練習記録${added}件）。` : `練習記録${added}件などを追加しました。` };
  toast('復元しました'); drawRst();
};

/* ---------- 全データ削除 ---------- */
ACT.wipe = () => {
  const bg = modal(`<h3>全データを削除</h3><p>練習記録${S.workouts.length}件、大会、練習予定、目標、シューズ、設定をすべて削除します。<b>取り消すことはできません。</b>\n必要な場合は先に「JSONバックアップ」を行ってください。</p>
   <div class="field"><label for="wipe-in">確認のため「削除」と入力してください</label><input type="text" id="wipe-in" autocomplete="off"></div>
   <div class="btns"><button class="btn" data-r="0">キャンセル</button><button class="btn danger" data-r="1" disabled>すべて削除する</button></div>`,
    async (e, bg) => {
      const b = e.target.closest('[data-r]'); if (!b) return;
      if (b.dataset.r === '0') { bg.remove(); return; }
      b.disabled = true;
      try { await DB.tx(DB.STORES, 'readwrite', st => { DB.STORES.forEach(s => st[s].clear()); st.kv.put({ key: 'seeded', value: true }); st.kv.put({ key: 'types', value: C.DEFAULT_TYPES }); }); }
      catch (er) { bg.remove(); toast('削除できませんでした：' + errMsg(er), true); return; }
      bg.remove(); await loadAll(); toast('全データを削除しました'); go('home');
    });
  const inp = $('#wipe-in', bg), btn = $('[data-r="1"]', bg);
  inp.addEventListener('input', () => { btn.disabled = inp.value.trim() !== '削除'; });
  setTimeout(() => inp.focus(), 30);
};

setupPWA();
boot();
</script>
